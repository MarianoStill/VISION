name: Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install supported Python
        run: uv python install 3.14
      - name: Create project environment
        run: uv venv --python 3.14 .venv
      - name: Install project extras
        run: uv sync --locked --all-extras
      - name: Ruff lint (changed application and validation surfaces)
        run: |
          .venv/bin/ruff check --select E4,E7,E9,F --extend-ignore E402,E701,E702 \
            apps/vision/src/vision/development_app.py \
            apps/vision/src/vision/auth.py \
            apps/vision/src/vision/authorization.py \
            apps/vision/src/vision/asgi_app.py \
            apps/vision/src/vision/role_selection.py \
            apps/vision/src/vision/o2c_workspace.py \
            apps/vision/src/vision/data_admin.py \
            scripts/hash_auth_password.py \
            scripts/regression_compare.py \
            scripts/check.py \
            tests/auth/test_temporary_auth.py \
            tests/auth/test_authorization.py \
            tests/auth/asgi_client.py \
            tests/integration/test_asgi_auth.py \
            tests/integration/test_check_script.py \
            tests/integration/test_regression_compare.py \
            tests/vision/test_development_app.py \
            tests/vision/test_folder_sync.py \
            tests/e2e/seed.py \
            tests/e2e/conftest.py \
            tests/e2e/test_ui_roles.py
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --all-extras --format requirements-txt --no-emit-project \
            --output-file "$RUNNER_TEMP/vision-requirements.txt"
          .venv/bin/pip-audit --strict --requirement "$RUNNER_TEMP/vision-requirements.txt"
      - name: Compile Bicep template (offline syntax check; no Azure login or resources)
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: Verify imports resolve to this checkout
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, covision, lion, proof, vision
          root = pathlib.Path.cwd().resolve()
          for module in (covision, lion, proof, vision):
              path = pathlib.Path(module.__file__).resolve()
              assert root in path.parents, (module.__name__, path)
          PY
      - name: Run canonical check
        run: .venv/bin/python scripts/check.py
      - name: Run tests with JUnit report
        run: .venv/bin/python -m pytest -q -p no:cacheprovider --junitxml=candidate.xml
      - name: Measure coverage
        run: |
          .venv/bin/coverage run --data-file=.coverage -m pytest -q -p no:cacheprovider --ignore=tests/e2e
          .venv/bin/coverage report
          .venv/bin/coverage xml -o coverage.xml
          .venv/bin/coverage html -d htmlcov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-candidate
          path: candidate.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  regression-vs-main:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.14
      - name: Test main baseline
        run: |
          uv export --locked --all-extras --format requirements-txt --no-emit-project \
            --output-file "$RUNNER_TEMP/vision-requirements.txt"
          git worktree add "$RUNNER_TEMP/vision-baseline" origin/main
          cd "$RUNNER_TEMP/vision-baseline"
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/vision-requirements.txt"
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
          .venv/bin/python -m pytest -q -p no:cacheprovider --junitxml="$GITHUB_WORKSPACE/baseline.xml" || true
      - uses: actions/download-artifact@v8
        with:
          name: junit-candidate
      - name: Differential comparison
        run: python3 scripts/regression_compare.py baseline.xml candidate.xml --json regression.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-report
          path: |
            regression.json
            baseline.xml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install 3.14
      - run: uv venv --python 3.14 .venv
      - name: Install project extras
        run: uv sync --locked --all-extras
      - name: Install Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Playwright UI tests (synthetic data, loopback only)
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/e2e --junitxml=e2e.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-e2e
          path: e2e.xml
