name: Validation

on:
  pull_request:
    branches:
      - chore/technical-foundation
      - chore/cloud-validation-cross-platform
      - feature/vision-usable-mvp
  push:
    branches:
      - chore/technical-foundation
      - "chore/**"
      - feature/vision-usable-mvp

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install supported Python
        run: uv python install 3.14
      - name: Create project environment
        run: uv venv --python 3.14 .venv
      - name: Install project extras
        run: uv pip install --python .venv/bin/python -e '.[test,vision,lion,proof]'
      - name: Run canonical check
        run: .venv/bin/python scripts/check.py
