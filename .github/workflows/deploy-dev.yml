name: Deploy DEV (Azure App Service)

# PREPARED, NOT ACTIVE. This workflow does nothing until IT provisions the Azure resources, a
# federated (OIDC) identity, a protected GitHub Environment named "dev", and the repository
# variable AZURE_DEV_DEPLOY_ENABLED=true. No secrets are used or required.
# Manual only: pick a ref (branch, tag or SHA). To roll back, run it again with the previous
# known-good tag/SHA.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to deploy; use a previous good tag/SHA to roll back
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  gate:
    # Fail closed: nothing runs unless deployment was explicitly enabled.
    if: ${{ vars.AZURE_DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require a successful Validation run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Validation \
            --commit "$SHA" --status success --json databaseId --jq 'length')
          if [ "$count" -lt 1 ]; then
            echo "No successful Validation run for $SHA; refusing to deploy." >&2
            exit 1
          fi

  deploy:
    needs: gate
    # Dedicated, isolated runner hosted inside an IT-approved network whose egress CIDR
    # is included in allowedCidrs. Do not replace with GitHub-hosted runners: their IP
    # ranges are broad/dynamic and are not suitable for this SCM allowlist.
    runs-on: [self-hosted, linux, x64, vision-dev-deploy]
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build deployment package (source plus locked runtime requirements)
        run: |
          uv export --locked --extra vision --extra lion --extra proof --no-emit-project \
            --format requirements-txt --output-file requirements.txt
          mkdir -p package/tests/e2e
          cp -r apps modules shared deploy requirements.txt package/
          cp tests/__init__.py package/tests/
          cp tests/e2e/__init__.py tests/e2e/seed.py package/tests/e2e/
          find package -name __pycache__ -prune -exec rm -rf {} +
          (cd package && zip -qr ../vision-dev.zip .)
      - name: Sign in to Azure with OIDC (no client secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_DEV_WEBAPP_NAME }}
          package: vision-dev.zip
      - name: Confirm the app reports Running
        run: |
          state=$(az webapp show --name "${{ vars.AZURE_DEV_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_DEV_RESOURCE_GROUP }}" --query state -o tsv)
          test "$state" = "Running"
      - name: Smoke test /_stcore/health (only if IT allows runner access)
        if: ${{ vars.AZURE_DEV_SMOKE_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ vars.AZURE_DEV_SMOKE_URL }}/_stcore/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed; roll back by re-running with the previous good ref." >&2
          exit 1
