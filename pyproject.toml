[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "co-vision"
version = "0.1.0"
description = "Technical foundation for the modular CO-VISION product"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1", "setuptools==84.2.1"]
vision = ["streamlit==1.66.1"]
lion = ["pandas==2.3.3", "openpyxl==3.1.5"]
proof = ["openpyxl==3.1.5"]
e2e = ["pytest-playwright==0.10.0", "playwright==1.64.1"]
quality = ["coverage==7.17.0", "pip-audit==2.10.1", "ruff==0.17.3"]

[tool.setuptools]
packages = ["covision", "proof", "lion", "vision"]

[tool.setuptools.package-dir]
covision = "shared/python/covision"
proof = "modules/proof/src/proof"
lion = "modules/lion/src/lion"
vision = "apps/vision/src/vision"

[tool.pytest.ini_options]
testpaths = ["tests/proof", "tests/lion", "tests/vision", "tests/integration", "tests/regression"]
addopts = "-ra"
markers = ["e2e: browser UI tests (Playwright); run with 'pytest tests/e2e'"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["covision", "lion", "proof", "vision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
